
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Cloud LED</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>ESP32 Cloud LED</h1>
        <p>Controle de LED a distance</p>

        <div class="led" id="ledIndicator"></div>

        <h2 id="ledStatus">Chargement...</h2>

        <div class="buttons">
            <button class="btn-on" onclick="controlLED('on')">
                ON
            </button>

            <button class="btn-off" onclick="controlLED('off')">
                OFF
            </button>
        </div>

        <p id="message">Connexion au serveur...</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
